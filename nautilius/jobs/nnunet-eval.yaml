# nautilius/jobs/nnunet-eval.yaml
#
# Segmentation-based evaluation of CWDM synthesis quality.
#
# For each synthesized modality (t1n/t1c/t2w/t2f):
#   1. Reformat: assemble (3 real + 1 synthesized) → nnUNet imagesTs/ format
#   2. Predict:  run nnUNetv2_predict (ensemble over 5 folds)
#   3. Evaluate: compute WT/TC/ET Dice vs ground-truth seg masks → CSV + WandB
#
# Prerequisites:
#   - eval-cwdm.yaml complete: synthesized outputs at /pvc/outputs/cwdm/test/
#   - nnunet-train.yaml complete: weights at /pvc/nnunet/results/Dataset001_BraTS2023_GLI/
#
# Deploy:
#   kubectl apply -f nautilius/jobs/nnunet-eval.yaml
#   kubectl logs -f job/nnunet-eval -n gai-lina-group
#
# Delete:
#   kubectl delete -f nautilius/jobs/nnunet-eval.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: nnunet-eval
  namespace: gai-lina-group
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: evaluator
          image: ghcr.io/kagozi/brats23-cwdm:latest
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: nnUNet_raw
              value: "/pvc/nnunet/raw"
            - name: nnUNet_preprocessed
              value: "/pvc/nnunet/preprocessed"
            - name: nnUNet_results
              value: "/pvc/nnunet/results"
            - name: WANDB_PROJECT
              value: "brats2023-cwdm"
            - name: WANDB_MODE
              value: "online"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: api_key
            - name: WANDB_ENTITY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: entity
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              DATASET_ID="001"
              SYNTHESIS_ROOT="/pvc/outputs/cwdm/test"
              TEST_DATA_DIR="/pvc/data/brats23/test"
              IMAGES_ROOT="/pvc/nnunet/imagesTs"
              PRED_ROOT="/pvc/nnunet/predictions"
              DICE_OUT="/pvc/outputs/cwdm/dice"
              mkdir -p "$IMAGES_ROOT" "$PRED_ROOT" "$DICE_OUT"

              echo "=== nnUNet Segmentation Evaluation — BraTS 2023 CWDM ==="
              echo "Synthesis root: $SYNTHESIS_ROOT"
              echo "Test data dir : $TEST_DATA_DIR"
              echo "nnUNet results: $nnUNet_results"
              echo ""

              for MOD in t1n t1c t2w t2f; do
                IMAGES_TS="$IMAGES_ROOT/imagesTs_${MOD}"
                PRED_DIR="$PRED_ROOT/${MOD}"
                mkdir -p "$PRED_DIR"

                echo "============================================================"
                echo "  Modality: $MOD"
                echo "============================================================"

                # ── Step 1: Reformat synthesis outputs → imagesTs/ ──────────────
                # Each modality's synthesis outputs are in $SYNTHESIS_ROOT/$MOD/
                echo ">>> Reformatting ${MOD} synthesis outputs..."
                python scripts/reformat_for_nnunet.py \
                  --synthesis_dir "$SYNTHESIS_ROOT/$MOD" \
                  --test_data_dir "$TEST_DATA_DIR" \
                  --output_root   "$IMAGES_ROOT" \
                  --modalities    "$MOD"

                N_CASES=$(ls "$IMAGES_TS"/*_0000.nii.gz 2>/dev/null | wc -l)
                echo "    Reformatted $N_CASES cases"

                # ── Step 2: nnUNet prediction (ensemble all 5 folds) ────────────
                echo ">>> Running nnUNet inference for synthesized ${MOD}..."
                nnUNetv2_predict \
                  -i  "$IMAGES_TS" \
                  -o  "$PRED_DIR" \
                  -d  "$DATASET_ID" \
                  -c  3d_fullres \
                  -f  0 1 2 3 4

                # ── Step 3: Compute WT/TC/ET Dice ───────────────────────────────
                echo ">>> Computing WT/TC/ET Dice for synthesized ${MOD}..."
                python scripts/evaluate_synthesis.py \
                  --pred_dir              "$PRED_DIR" \
                  --gt_dir                "$TEST_DATA_DIR" \
                  --synthesized_modality  "$MOD" \
                  --output_dir            "$DICE_OUT"

                echo ">>> Done: ${MOD}"
                echo ""
              done

              echo "=== All modalities evaluated ==="
              echo "Dice CSVs at: $DICE_OUT"
              for MOD in t1n t1c t2w t2f; do
                CSV="$DICE_OUT/dice_${MOD}.csv"
                if [ -f "$CSV" ]; then
                  echo "--- $MOD ---"
                  head -1 "$CSV"
                  tail -n +2 "$CSV" | awk -F',' '
                    NR>0 { wt+=$2; tc+=$3; et+=$4; n++ }
                    END  { printf "  Mean  WT=%.4f  TC=%.4f  ET=%.4f  (n=%d)\n", wt/n, tc/n, et/n, n }
                  '
                fi
              done

          resources:
            requests:
              memory: "24Gi"
              cpu: "8"
              nvidia.com/a100: "1"
              ephemeral-storage: "0"
            limits:
              memory: "32Gi"
              cpu: "10"
              nvidia.com/a100: "1"
              ephemeral-storage: "100Gi"
          volumeMounts:
            - name: brats23-vol
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: brats23-vol
          persistentVolumeClaim:
            claimName: brats23-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 24Gi
