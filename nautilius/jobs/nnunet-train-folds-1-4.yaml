# nautilius/jobs/nnunet-train-folds-1-4.yaml
#
# Parallel nnUNet v2 fold training for folds 1–4.
# Fold 0 is handled by the existing nnunet-train job.
#
# Prerequisites (already satisfied once fold 0 is past epoch ~1):
#   - Dataset conversion (Step 1) complete → imagesTr/ + labelsTr/ populated
#   - Plan & preprocess (Step 2) complete → nnUNetPlans.json exists
#
# Each job trains one fold independently and writes only to its own
# fold_N/ directory — no conflicts with each other or with fold 0.
#
# Deploy (safe to run while nnunet-train fold-0 is still running):
#   kubectl apply -f nautilius/jobs/nnunet-train-folds-1-4.yaml
#
# Watch logs:
#   kubectl logs -f job/nnunet-train-fold-1 -n gai-lina-group
#   kubectl logs -f job/nnunet-train-fold-2 -n gai-lina-group
#   kubectl logs -f job/nnunet-train-fold-3 -n gai-lina-group
#   kubectl logs -f job/nnunet-train-fold-4 -n gai-lina-group
#
# After ALL 5 folds complete, run find_best_configuration:
#   kubectl apply -f nautilius/jobs/nnunet-find-best.yaml
#
# Delete:
#   kubectl delete -f nautilius/jobs/nnunet-train-folds-1-4.yaml

---
apiVersion: batch/v1
kind: Job
metadata:
  name: nnunet-train-fold-1
  namespace: gai-lina-group
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: trainer
          image: ghcr.io/kagozi/brats23-cwdm:latest
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: nnUNet_raw
              value: "/pvc/nnunet/raw"
            - name: nnUNet_preprocessed
              value: "/pvc/nnunet/preprocessed"
            - name: nnUNet_results
              value: "/pvc/nnunet/results"
            - name: WANDB_PROJECT
              value: "brats2023-cwdm"
            - name: WANDB_MODE
              value: "online"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: api_key
            - name: WANDB_ENTITY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: entity
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              DATASET_ID="001"
              FOLD=1

              echo "=== nnUNet v2 — Fold ${FOLD} ==="
              echo "nnUNet_preprocessed : $nnUNet_preprocessed"
              echo "nnUNet_results      : $nnUNet_results"

              # Verify preprocessing is complete before starting
              PLANS_FILE="$nnUNet_preprocessed/Dataset${DATASET_ID}_BraTS2023_GLI/nnUNetPlans.json"
              if [ ! -f "$PLANS_FILE" ]; then
                echo "ERROR: nnUNetPlans.json not found at $PLANS_FILE"
                echo "       Run nnunet-train (fold 0) through Step 2 first."
                exit 1
              fi
              echo ">>> Preprocessing confirmed — nnUNetPlans.json found."

              CKPT="$nnUNet_results/Dataset${DATASET_ID}_BraTS2023_GLI/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_${FOLD}/checkpoint_final.pth"
              if [ -f "$CKPT" ]; then
                echo ">>> Fold $FOLD already complete — exiting."
                exit 0
              fi

              echo ">>> Training fold $FOLD ..."
              nnUNetv2_train "$DATASET_ID" 3d_fullres "$FOLD" \
                --npz \
                --c

              echo "=== Fold ${FOLD} complete ==="
          resources:
            requests:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/a100: "1"
              ephemeral-storage: "0"
            limits:
              memory: "40Gi"
              cpu: "10"
              nvidia.com/a100: "1"
              ephemeral-storage: "100Gi"
          volumeMounts:
            - name: brats23-vol
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: brats23-vol
          persistentVolumeClaim:
            claimName: brats23-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi

