# nautilius/jobs/nnunet-eval-pretrained-phase2.yaml
#
# Segmentation evaluation of phase-2 CWDM synthesis using the BraTS-2021
# pretrained nnUNet (Dataset137, fold 5) — matches Fast-cWDM paper Table 2.
#
# Prerequisites:
#   - eval-cwdm-phase2.yaml complete (synthesized outputs present)
#   - Dataset137 weights downloaded (or will be downloaded on first run)
#
# Deploy:
#   kubectl apply -f nautilius/jobs/nnunet-eval-pretrained-phase2.yaml
#   kubectl logs -f job/nnunet-eval-pretrained-p2 -n gai-lina-group
#
# Delete:
#   kubectl delete -f nautilius/jobs/nnunet-eval-pretrained-phase2.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: nnunet-eval-pretrained-p2
  namespace: gai-lina-group
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: evaluator
          image: ghcr.io/kagozi/brats23-cwdm:latest
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: nnUNet_raw
              value: "/pvc/nnunet/raw"
            - name: nnUNet_preprocessed
              value: "/pvc/nnunet/preprocessed"
            - name: nnUNet_results
              value: "/pvc/nnunet/results"
            - name: WANDB_PROJECT
              value: "brats2023-cwdm"
            - name: WANDB_MODE
              value: "online"
            - name: TRAINING_PHASE
              value: "2"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: api_key
            - name: WANDB_ENTITY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: entity
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              PHASE="${TRAINING_PHASE:-}"
              SYNTHESIS_ROOT="/pvc/outputs/cwdm/${PHASE:+phase${PHASE}/}test"
              TEST_DATA_DIR="/pvc/data/brats23/test"
              IMAGES_ROOT="/pvc/nnunet/imagesTs${PHASE:+_phase${PHASE}}"
              PRED_ROOT="/pvc/nnunet/predictions_pretrained${PHASE:+_phase${PHASE}}"
              DICE_OUT="/pvc/outputs/cwdm/${PHASE:+phase${PHASE}/}dice_pretrained"
              mkdir -p "$PRED_ROOT" "$DICE_OUT"

              DATASET_ID="137"
              MODEL_DIR="$nnUNet_results/Dataset${DATASET_ID}_BraTS2021/nnUNetTrainer__nnUNetPlans__3d_fullres"
              FOLD_DIR="$MODEL_DIR/fold_5"

              echo "=== nnUNet Pretrained Eval (Dataset137 BraTS-2021, fold 5) ==="
              echo "Phase         : ${PHASE:-default}"
              echo "Synthesis root: $SYNTHESIS_ROOT"
              echo "Images root   : $IMAGES_ROOT"
              echo "Predictions   : $PRED_ROOT"
              echo "Dice out      : $DICE_OUT"
              echo ""

              # ── Step 1: Download pretrained weights (skip if already present) ──
              if [ ! -f "$FOLD_DIR/checkpoint_final.pth" ]; then
                echo ">>> Downloading Dataset137 pretrained weights..."
                pip install -q gdown
                mkdir -p "$FOLD_DIR"

                gdown "1n9dqT114udr9Qq8iYEKsJK347iHg9N88" \
                  -O "$FOLD_DIR/checkpoint_final.pth"

                mkdir -p "$nnUNet_results/Dataset${DATASET_ID}_BraTS2021"
                gdown "1A_suxQwElucF3w1HEYg3wMo6dG9OxBHo" \
                  -O "$nnUNet_results/Dataset${DATASET_ID}_BraTS2021/dataset.json"
                cp "$nnUNet_results/Dataset${DATASET_ID}_BraTS2021/dataset.json" \
                   "$MODEL_DIR/dataset.json"

                gdown "1U2b0BTNi8zrJACReoi_W08Fe-wM394wI" \
                  -O "$MODEL_DIR/plans.json"

                echo ">>> Download complete."
              else
                echo ">>> Dataset137 weights already present — skipping download."
              fi

              cp "$nnUNet_results/Dataset${DATASET_ID}_BraTS2021/dataset.json" \
                 "$MODEL_DIR/dataset.json"

              # ── Step 2: Per-modality predict + evaluate ──────────────────────
              for MOD in t1n t1c t2w t2f; do
                IMAGES_TS="$IMAGES_ROOT/imagesTs_${MOD}"
                PRED_DIR="$PRED_ROOT/${MOD}"
                mkdir -p "$PRED_DIR"

                echo "============================================================"
                echo "  Modality: $MOD"
                echo "============================================================"

                N_EXISTING=$(ls "$IMAGES_TS"/*_0000.nii.gz 2>/dev/null | wc -l)
                if [ "$N_EXISTING" -eq 0 ]; then
                  echo ">>> imagesTs empty — reformatting synthesis outputs..."
                  python scripts/reformat_for_nnunet.py \
                    --synthesis_dir "$SYNTHESIS_ROOT/$MOD" \
                    --test_data_dir "$TEST_DATA_DIR" \
                    --output_root   "$IMAGES_ROOT" \
                    --modalities    "$MOD"
                else
                  echo ">>> imagesTs already has $N_EXISTING cases — skipping reformat."
                fi

                echo ">>> Running nnUNetv2_predict (Dataset137, fold 5)..."
                nnUNetv2_predict \
                  -i  "$IMAGES_TS" \
                  -o  "$PRED_DIR" \
                  -d  "$DATASET_ID" \
                  -c  3d_fullres \
                  -f  5

                echo ">>> Computing WT/TC/ET Dice (pred_ncr_label=2, pred_et_label=3)..."
                python scripts/evaluate_synthesis.py \
                  --pred_dir              "$PRED_DIR" \
                  --gt_dir                "$TEST_DATA_DIR" \
                  --synthesized_modality  "$MOD" \
                  --output_dir            "$DICE_OUT" \
                  --pred_ncr_label        2 \
                  --pred_et_label         3

                echo ">>> Done: ${MOD}"
                echo ""
              done

              # ── Step 3: Summary ───────────────────────────────────────────────
              echo "=== All modalities evaluated (pretrained model) ==="
              echo "Dice CSVs at: $DICE_OUT"
              for MOD in t1n t1c t2w t2f; do
                CSV="$DICE_OUT/dice_${MOD}.csv"
                if [ -f "$CSV" ]; then
                  echo "--- $MOD ---"
                  tail -n +2 "$CSV" | awk -F',' '
                    { n++
                      if ($2 != "nan" && $2 != "") { wt+=$2; wt_n++ }
                      if ($3 != "nan" && $3 != "") { tc+=$3; tc_n++ }
                      if ($4 != "nan" && $4 != "") { et+=$4; et_n++ }
                    }
                    END {
                      printf "  WT=%.4f (n=%d)  TC=%.4f (n=%d)  ET=%.4f (n=%d)\n",
                        (wt_n>0 ? wt/wt_n : 0), wt_n,
                        (tc_n>0 ? tc/tc_n : 0), tc_n,
                        (et_n>0 ? et/et_n : 0), et_n
                    }
                  '
                fi
              done

          resources:
            requests:
              memory: "24Gi"
              cpu: "8"
              nvidia.com/a100: "1"
              ephemeral-storage: "0"
            limits:
              memory: "28Gi"
              cpu: "9"
              nvidia.com/a100: "1"
              ephemeral-storage: "100Gi"
          volumeMounts:
            - name: brats23-vol
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: brats23-vol
          persistentVolumeClaim:
            claimName: brats23-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 24Gi
