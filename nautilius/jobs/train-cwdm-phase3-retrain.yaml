# nautilius/jobs/train-cwdm-phase3-retrain.yaml
#
# Fast-CWDM RETRAIN — phase 3: 400k→600k steps.
# Resumes from the phase 2 best checkpoint in cwdm_retrain via auto-resume in run.sh.
# Saves brats_{mod}_phase3_best.pt at end of training.
#
# Deploy:
#   kubectl apply -f nautilius/jobs/train-cwdm-phase3-retrain.yaml
#
# Monitor:
#   kubectl logs -f job/retrain-cwdm-p3-t1n -n gai-lina-group
#   kubectl logs -f job/retrain-cwdm-p3-t1c -n gai-lina-group
#   kubectl logs -f job/retrain-cwdm-p3-t2w -n gai-lina-group
#   kubectl logs -f job/retrain-cwdm-p3-t2f -n gai-lina-group
#
# Delete:
#   kubectl delete -f nautilius/jobs/train-cwdm-phase3-retrain.yaml

# =============================================================================
# t1n
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: retrain-cwdm-p3-t1n
  namespace: gai-lina-group
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: job-name
                    operator: In
                    values:
                      - retrain-cwdm-p3-t1n
                      - retrain-cwdm-p3-t1c
                      - retrain-cwdm-p3-t2w
                      - retrain-cwdm-p3-t2f
              topologyKey: kubernetes.io/hostname
      containers:
        - name: trainer
          image: ghcr.io/kagozi/brats23-cwdm:latest
          imagePullPolicy: Always
          env:
            - name: TRAIN_MODALITY
              value: "t1n"
            - name: SAMPLE_STRATEGY
              value: "sampled"
            - name: TIMESTEPS
              value: "100"
            - name: TRAIN_DATA_DIR
              value: "/pvc/data/brats23/train"
            - name: CHECKPOINT_DIR
              value: "/pvc/checkpoints/cwdm_retrain"
            - name: WANDB_PROJECT
              value: "brats2023-cwdm"
            - name: WANDB_MODE
              value: "online"
            - name: TRAINING_PHASE
              value: "3"
            - name: LR_ANNEAL_STEPS
              value: "600000"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: api_key
            - name: WANDB_ENTITY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: entity
          resources:
            requests:
              memory: "20Gi"
              cpu: "6"
              nvidia.com/a100: "1"
              ephemeral-storage: "0"
            limits:
              memory: "24Gi"
              cpu: "7"
              nvidia.com/a100: "1"
              ephemeral-storage: "50Gi"
          volumeMounts:
            - name: brats23-vol
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: brats23-vol
          persistentVolumeClaim:
            claimName: brats23-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

