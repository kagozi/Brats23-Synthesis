# nautilius/jobs/nnunet-train.yaml
#
# Train nnUNet v2 on the BraTS 2023 training split (~876 cases with seg masks).
# This produces the segmenter used in nnunet-eval.yaml to compute Dice scores
# on synthesized test-set modalities.
#
# Steps performed in sequence (all resumable via nnUNet checkpoints):
#   1. Convert training data → nnUNet Dataset001 format
#   2. Plan & preprocess (fingerprint + patch size selection)
#   3. Train 5-fold cross-validation (3d_fullres)
#   4. Find best configuration for ensemble inference
#
# Expected wall time: 3–5 days on a single A100 80 GB
# Pod restarts are safe — nnUNet detects existing checkpoints and continues.
#
# Deploy:
#   kubectl apply -f nautilius/jobs/nnunet-train.yaml
#   kubectl logs -f job/nnunet-train -n gai-lina-group
#
# Delete:
#   kubectl delete -f nautilius/jobs/nnunet-train.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: nnunet-train
  namespace: gai-lina-group
spec:
  backoffLimit: 10          # allow many restarts — each resumes from checkpoint
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: trainer
          image: ghcr.io/kagozi/brats23-cwdm:latest
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: nnUNet_raw
              value: "/pvc/nnunet/raw"
            - name: nnUNet_preprocessed
              value: "/pvc/nnunet/preprocessed"
            - name: nnUNet_results
              value: "/pvc/nnunet/results"
            - name: WANDB_PROJECT
              value: "brats2023-cwdm"
            - name: WANDB_MODE
              value: "online"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: api_key
            - name: WANDB_ENTITY
              valueFrom:
                secretKeyRef:
                  name: wandb-credentials
                  key: entity
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              DATASET_ID="001"
              TRAIN_DIR="/pvc/data/brats23/train"

              echo "=== nnUNet v2 Training — BraTS 2023 GLI ==="
              echo "Train dir   : $TRAIN_DIR"
              echo "nnUNet_raw  : $nnUNet_raw"
              echo "nnUNet_res  : $nnUNet_results"
              mkdir -p "$nnUNet_raw" "$nnUNet_preprocessed" "$nnUNet_results"

              # ── Step 1: Convert to nnUNet format ──────────────────────────────
              # Always regenerate dataset.json (cheap) so format changes take
              # effect even when imagesTr/ already exists from a previous run.
              DATASET_DIR="$nnUNet_raw/Dataset${DATASET_ID}_BraTS2023_GLI"
              IMAGES_DONE="$DATASET_DIR/imagesTr"
              if [ -d "$IMAGES_DONE" ] && [ "$(ls -A $IMAGES_DONE)" ]; then
                echo ">>> imagesTr already populated — regenerating dataset.json only..."
                python scripts/prepare_nnunet_dataset.py \
                  --input_dir  "$TRAIN_DIR" \
                  --nnunet_raw "$nnUNet_raw"
              else
                echo ">>> Converting training data to nnUNet format..."
                python scripts/prepare_nnunet_dataset.py \
                  --input_dir  "$TRAIN_DIR" \
                  --nnunet_raw "$nnUNet_raw"
              fi

              # ── Step 2: Plan & preprocess ─────────────────────────────────────
              # Re-run if plans.json is missing (handles first run and
              # the case where preprocessing was built against a bad dataset.json).
              PREP_DIR="$nnUNet_preprocessed/Dataset${DATASET_ID}_BraTS2023_GLI"
              PLANS_FILE="$PREP_DIR/nnUNetPlans.json"
              if [ ! -f "$PLANS_FILE" ]; then
                echo ">>> Planning and preprocessing..."
                rm -rf "$PREP_DIR"   # remove any partial state from a prior failed run
                nnUNetv2_plan_and_preprocess \
                  -d "$DATASET_ID" \
                  --verify_dataset_integrity \
                  -c 3d_fullres
              else
                echo ">>> Preprocessing already done — skipping."
              fi

              # ── Step 3: Train 5 folds (each resumes if checkpoint exists) ─────
              for FOLD in 0 1 2 3 4; do
                CKPT="$nnUNet_results/Dataset${DATASET_ID}_BraTS2023_GLI/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_${FOLD}/checkpoint_final.pth"
                if [ -f "$CKPT" ]; then
                  echo ">>> Fold $FOLD already complete — skipping."
                else
                  echo ">>> Training fold $FOLD ..."
                  nnUNetv2_train "$DATASET_ID" 3d_fullres "$FOLD" \
                    --npz \
                    --c
                fi
              done

              # ── Step 4: Find best configuration ───────────────────────────────
              echo ">>> Finding best configuration..."
              nnUNetv2_find_best_configuration "$DATASET_ID" -c 3d_fullres

              echo ""
              echo "=== nnUNet training complete ==="
              echo "Weights at: $nnUNet_results/Dataset${DATASET_ID}_BraTS2023_GLI/"
              echo "Run nnunet-eval.yaml next."

          resources:
            requests:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/a100: "1"
              ephemeral-storage: "0"
            limits:
              memory: "40Gi"
              cpu: "10"
              nvidia.com/a100: "1"
              ephemeral-storage: "100Gi"
          volumeMounts:
            - name: brats23-vol
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: brats23-vol
          persistentVolumeClaim:
            claimName: brats23-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
